<div class="container my-4">
  <h2 class="mb-4">Categorías Registradas</h2>
  <div class="row">
    <div class="col-md-4 mb-3" *ngFor="let cat of categorias">
      <div class="card shadow-sm h-100">
        <div class="card-body">
          <h5 class="card-title text-primary">{{ cat.nombre }}</h5>
          <p class="card-text text-muted">{{ cat.descripcion }}</p>
        </div>
      </div>
    </div>
  </div>
</div>
